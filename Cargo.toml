[package]
name = "data-scraper"
version = "0.1.0"
edition = "2024"
description = "High-performance Windows data scraper with native GUI"
authors = ["Data Scraper Team"]
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# GUI
eframe = "0.35"

# Async runtime
tokio = { version = "1.53", features = ["full"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.13", features = ["gzip", "brotli", "socks", "json", "stream"] }

# HTML parsing
scraper = "0.27"

# Charset decoding
encoding_rs = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Storage
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
csv = "1.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
